<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A maior Black Friday da Grudado em Você está quase aqui.">
  <meta name="theme-color" content="#1A1D21">
  <title>Lista VIP Black Friday — Grudado em Você</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/countdown.css">
</head>
<body>

  <main class="cd-page">

    <!-- Área à esquerda — logo + formulário, empilhados e centrados na parte escura -->
    <div class="cd-stage">
      <div class="cd-panel">

        <img class="cd-logo" src="assets/images/logo-1-dark.png" alt="Grudado em Você" width="4535" height="903">

        <h1 class="cd-title">BLACK<span class="cd-title__accent">FRIDAY</span></h1>
        <p class="cd-subheadline">Fechamos a loja. Por um <strong>ótimo motivo.</strong><br>Quando o contador zerar, começa a <strong class="cd-subheadline__nowrap">maior <span class="cd-subheadline__accent">Black Friday</span></strong>.</p>

        <div class="cd-countdown" aria-label="Contagem regressiva para o início das ofertas">
          <p class="cd-countdown__label">As ofertas começam em <span class="cd-countdown__star">✳</span></p>
          <div class="cd-countdown__grid">
            <div class="cd-countdown__unit">
              <span class="cd-countdown__value" id="cd-days">00</span>
              <span class="cd-countdown__unit-label">Dias</span>
            </div>
            <div class="cd-countdown__unit">
              <span class="cd-countdown__value" id="cd-hours">00</span>
              <span class="cd-countdown__unit-label">Horas</span>
            </div>
            <div class="cd-countdown__unit">
              <span class="cd-countdown__value" id="cd-minutes">00</span>
              <span class="cd-countdown__unit-label">Minutos</span>
            </div>
            <div class="cd-countdown__unit">
              <span class="cd-countdown__value" id="cd-seconds">00</span>
              <span class="cd-countdown__unit-label">Segundos</span>
            </div>
          </div>
        </div>

        <p class="cd-callout">Ofertas <strong>EXCLUSIVAS</strong> para quem entra na lista!</p>

        <form class="cd-form" id="cd-form" novalidate>

          <div class="cd-field">
            <label class="visually-hidden" for="cd-nome">Nome</label>
            <svg class="cd-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <input class="cd-field__input" type="text" id="cd-nome" name="nome"
                   placeholder="Nome"
                   autocomplete="given-name" required minlength="2">
          </div>

          <div class="cd-field">
            <label class="visually-hidden" for="cd-email">E-mail</label>
            <svg class="cd-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            <input class="cd-field__input" type="email" id="cd-email" name="email"
                   placeholder="E-mail"
                   autocomplete="email" required>
          </div>

          <div class="cd-field">
            <label class="visually-hidden" for="cd-celular">Celular</label>
            <svg class="cd-field__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.45 3.45 1.32 4.95L2 22l5.29-1.39a9.87 9.87 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.64-1.03-5.13-2.9-7A9.82 9.82 0 0 0 12.04 2zm5.73 14.16c-.24.68-1.4 1.3-1.94 1.34-.5.04-1.05.24-3.53-.73-2.98-1.18-4.87-4.2-5.02-4.4-.15-.2-1.2-1.6-1.2-3.05 0-1.45.76-2.15 1.03-2.45.27-.29.6-.36.8-.36.2 0 .4 0 .58.01.19.01.44-.07.68.53.25.6.85 2.06.92 2.21.07.15.12.33.02.53-.1.2-.15.32-.3.5-.15.18-.31.4-.44.53-.15.15-.3.32-.13.62.17.3.76 1.25 1.63 2.02 1.12 1 2.06 1.31 2.36 1.46.3.15.48.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.68-.15.28.1 1.76.83 2.06.98.3.15.5.23.58.35.08.13.08.73-.16 1.41z"/></svg>
            <input class="cd-field__input" type="tel" id="cd-celular" name="celular"
                   placeholder="Celular"
                   autocomplete="tel-national" inputmode="numeric"
                   maxlength="15" required>
          </div>

          <button class="cd-submit" type="submit">Quero entrar para a Lista VIP</button>

        </form>

        <p class="cd-status" id="cd-status" role="status" hidden></p>
        <p class="cd-microcopy">
          <svg class="cd-microcopy__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Seus dados estão seguros com a gente.
        </p>

      </div>
    </div>

    <!--
      Forma gráfica (formas.svg) em três camadas concêntricas.
      O mesmo path é desenhado 3x; as faixas vêm do stroke, que infla a
      silhueta para fora de forma uniforme — inclusive na curva.
        camada 1 · Azul Escuro  · faixa externa
        camada 2 · Rosa         · faixa interna
        camada 3 · Verde        · preenchimento (base da imagem)
        camada 4 · imagem       · recortada pela forma, tipo PowerClip
      Sangra pelo topo, pela direita e pela base.
    -->
    <svg class="cd-shape" viewBox="0 0 1925.24 2137.44" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

      <defs>
        <clipPath id="cd-shape-clip">
          <path d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
        </clipPath>
      </defs>

      <path class="cd-shape__layer cd-shape__layer--outer" d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
      <path class="cd-shape__layer cd-shape__layer--mid"   d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
      <path class="cd-shape__layer cd-shape__layer--inner" d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>

      <!-- "slice" = comportamento cover: preenche a forma inteira sem distorcer -->
      <image class="cd-shape__image"
             href="assets/images/rastreio-hero.webp"
             x="-40" y="0" width="1925.24" height="2490"
             preserveAspectRatio="xMidYMid slice"
             clip-path="url(#cd-shape-clip)"/>
    </svg>

  </main>

  <script src="assets/js/countdown.js"></script>
</body>
</html>
