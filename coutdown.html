<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A maior Black Friday da Grudado em Você está quase aqui.">
  <meta name="theme-color" content="#1A1D21">
  <title>Lista VIP Black Friday — Grudado em Você</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/coutdown.css">
</head>
<body>

  <main class="cd-page">

    <!-- Área à esquerda — logo + formulário, empilhados e centrados na parte escura -->
    <div class="cd-stage">
      <div class="cd-panel">

        <img class="cd-logo" src="assets/images/logo-1-dark.png" alt="Grudado em Você" width="4535" height="903">

        <form class="cd-form" id="cd-form" novalidate>

          <div class="cd-field">
            <label class="cd-field__label" for="cd-nome">Nome</label>
            <input class="cd-field__input" type="text" id="cd-nome" name="nome"
                   placeholder="Como podemos te chamar?"
                   autocomplete="given-name" required minlength="2">
          </div>

          <div class="cd-field">
            <label class="cd-field__label" for="cd-email">E-mail</label>
            <input class="cd-field__input" type="email" id="cd-email" name="email"
                   placeholder="voce@email.com.br"
                   autocomplete="email" required>
          </div>

          <div class="cd-field">
            <label class="cd-field__label" for="cd-celular">Celular</label>
            <input class="cd-field__input" type="tel" id="cd-celular" name="celular"
                   placeholder="(21) 99999-9999"
                   autocomplete="tel-national" inputmode="numeric"
                   maxlength="15" required>
          </div>

          <button class="cd-submit" type="submit">Quero entrar para a Lista VIP</button>

        </form>

        <p class="cd-status" id="cd-status" role="status" hidden></p>
        <p class="cd-microcopy">Sem spam. Só novidades e ofertas da Black Friday.</p>

      </div>
    </div>

    <!--
      Forma gráfica (formas.svg) em três camadas concêntricas.
      O mesmo path é desenhado 3x; as faixas vêm do stroke, que infla a
      silhueta para fora de forma uniforme — inclusive na curva.
        camada 1 · Azul Escuro  · faixa externa
        camada 2 · Azul Claro   · faixa interna
        camada 3 · Verde        · preenchimento (base da imagem)
        camada 4 · imagem       · recortada pela forma, tipo PowerClip
      Sangra pelo topo, pela direita e pela base.
    -->
    <svg class="cd-shape" viewBox="0 0 1925.24 2137.44" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

      <defs>
        <clipPath id="cd-shape-clip">
          <path d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
        </clipPath>
      </defs>

      <path class="cd-shape__layer cd-shape__layer--outer" d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
      <path class="cd-shape__layer cd-shape__layer--mid"   d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>
      <path class="cd-shape__layer cd-shape__layer--inner" d="M15.98 1394.23l364.6 -1361.05c3.02,-11.27 6.44,-22.33 10.23,-33.19l1534.44 0 0 2137.44 -951.57 0 -625.26 -167.49c-249.86,-66.94 -399.37,-325.86 -332.44,-575.72z"/>

      <!-- "slice" = comportamento cover: preenche a forma inteira sem distorcer -->
      <image class="cd-shape__image"
             href="assets/images/rastreio-hero.webp"
             x="-40" y="0" width="1925.24" height="2490"
             preserveAspectRatio="xMidYMid slice"
             clip-path="url(#cd-shape-clip)"/>
    </svg>

  </main>

  <script src="assets/js/coutdown.js"></script>
</body>
</html>
